<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Turner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-teal-50">
    <header class="bg-gray-50">
        <div class="flex flex-col justify-between items-center">
            <h1 class="font-inter font-bold text-2xl ml-20">Page Turner</h1>
            <nav class="font-medium text-base flex flex-row items-center ml-290 gap-6">
                <a href=""><p class="text-gray-500">Browse</p></a>
                <a href=""><p class="text-gray-500">Hours</p></a>
            </nav>
        </div>
    </header>

    <main>
        <div>
            <h3 class="font-inter font-bold text-3xl pb-5 mt-8 ml-5">Staff Picks</h3>
            <p class="font-inter font-regular text-lg text-gray-500 ml-5">What we are pressing into people's hands this month</p>

            <div class="mt-20 flex flex-row ml-40 justify-center gap-12 mr-40">
                <div class="bg-slate-50 p-5 rounded-xl">
                    <img src="/img_assets/moby.jpg">
                    <p class="font-inter font-semi-bold text-xl mt-4">Moby Dick</p>
                    <p class="font-inter font-regular text-sm text-gray-500 mt-1">Herman Melville</p>
                    <p class="font-inter font-semi-bold text-sm text-teal-600 mt-1">$12</p>
                </div>

                <div class="bg-slate-50 p-5 rounded-xl">
                    <img src="/img_assets/frank.jpg">
                    <p class="font-inter font-semi-bold text-xl mt-4">Frankenstein</p>
                    <p class="font-inter font-regular text-sm text-gray-500 mt-1">Mary Shelley</p>
                    <p class="font-inter font-semi-bold text-sm text-teal-600 mt-1">$14</p>
                </div>

                <div class="bg-slate-50 p-5 rounded-xl">
                    <img src="/img_assets/call.jpg">
                    <p class="font-inter font-semi-bold text-xl mt-4">The Call of the Wild</p>
                    <p class="font-inter font-regular text-sm text-gray-500 mt-1">Jack London</p>
                    <p class="font-inter font-semi-bold text-sm text-teal-600 mt-1">$9</p>
                </div>
            </div>

            <div class="flex items-center justify-center p-16">
                <button class="bg-teal-700 rounded-xl p-3">
                    <p class="font-inter font-semibold text-lg text-slate-50">Browse the Shelfs</p>
                </button>
            </div>
     
        </div>
    </main>
    
</body>
</html>
